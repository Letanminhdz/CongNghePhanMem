<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&family=Fira+Code:wght@300..700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root { --muted-foreground: #64748B;
        --card-foreground: #0F172A;
        --destructive: #EF4444;
        --border: #E2E8F0;
        --foreground: #0F172A;
        --font-sans: "Inter", sans-serif;
        --secondary-foreground: #0F172A;
        --card: #FFFFFF;
        --ring: #2563EB;
        --input: #E2E8F0;
        --muted: #F1F5F9;
        --secondary: #F1F5F9;
        --radius: 0.75rem;
        --background: #F8FAFC;
        --primary: #2563EB;
        --primary-foreground: #FFFFFF;
        --font-heading: "Inter", sans-serif; }
    </style>
</head>

<body>
  <div class="min-h-screen w-full bg-background flex flex-row relative font-sans text-foreground">

    <!-- Sidebar -->
    <aside class="w-64 bg-card border-r border-border flex flex-col hidden md:flex h-screen sticky top-0">
      <div class="h-16 flex items-center px-6 border-b border-border">
        <div class="flex items-center gap-2 text-primary font-heading font-bold text-xl">
          <iconify-icon icon="lucide:activity"></iconify-icon>
          <span>MediAI</span>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-1">
        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-2 px-2">Main Menu</p>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:layout-dashboard" class="text-lg"></iconify-icon>
          Dashboard
        </a>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:message-circle" class="text-lg"></iconify-icon>
          AI Consult
        </a>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 bg-primary/10 text-primary rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:pill" class="text-lg"></iconify-icon>
          Medicines
        </a>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:microscope" class="text-lg"></iconify-icon>
          Diseases
        </a>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:shield-alert" class="text-lg"></iconify-icon>
          Interactions
        </a>

        <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mt-6 mb-2 px-2">Personal</p>
        <a href="#"
          class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
          <iconify-icon icon="lucide:bookmark" class="text-lg"></iconify-icon>
          Saved Items
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 h-screen overflow-y-auto">
      <!-- Header -->
      <header class="h-16 bg-card border-b border-border flex items-center justify-between px-6 sticky top-0 z-10">
        <div class="flex items-center gap-4">
          <button class="md:hidden text-muted-foreground hover:text-foreground">
            <iconify-icon icon="lucide:menu" class="text-2xl"></iconify-icon>
          </button>
          <h1 class="font-heading font-semibold text-lg text-foreground hidden sm:block">Medicine Database</h1>
        </div>
        <div class="flex items-center gap-4">
          <button class="relative text-muted-foreground hover:text-foreground transition-colors">
            <iconify-icon icon="lucide:bell" class="text-xl"></iconify-icon>
          </button>
          <div class="w-8 h-8 rounded-full overflow-hidden border border-border">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Profile"
              class="w-full h-full object-cover" />
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="p-6 lg:p-8 max-w-6xl mx-auto w-full flex-1 flex flex-col">

        <!-- Search & Filters -->
        <div class="mb-8 space-y-4">
          <div class="relative w-full shadow-sm">
            <iconify-icon icon="lucide:search"
              class="absolute left-4 top-1/2 -translate-y-1/2 text-muted-foreground text-xl"></iconify-icon>
            <input type="text" id="searchInput" placeholder="Search by medicine name, active ingredient, or condition..."
              class="w-full pl-12 pr-24 py-4 bg-card border border-border rounded-2xl text-base focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" />
            <button id="searchBtn"
              class="absolute right-3 top-1/2 -translate-y-1/2 bg-primary text-primary-foreground px-4 py-2 rounded-xl text-sm font-medium hover:bg-primary/90 transition-colors">
              Search
            </button>
          </div>
        </div>

        <div id="loadingIndicator" class="hidden text-center py-12 text-muted-foreground">
          <iconify-icon icon="lucide:loader-2" class="text-4xl animate-spin mx-auto mb-2"></iconify-icon>
          <p>Searching medications...</p>
        </div>

        <div id="errorMsg" class="hidden text-center py-4 text-destructive font-medium"></div>

        <!-- Results Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12">
          <!-- Dynamically populated drug cards -->
        </div>

      </div>
    </main>
  </div>

  <script src="/api.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsGrid = document.getElementById('resultsGrid');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMsg = document.getElementById('errorMsg');

    async function searchDrugs(query = "") {
      resultsGrid.innerHTML = '';
      errorMsg.classList.add('hidden');
      loadingIndicator.classList.remove('hidden');

      try {
        const url = query ? \`/drugs/search?q=\${encodeURIComponent(query)}&limit=12\` : \`/drugs/search?q=A&limit=12\`;
        const data = await window.apiClient.request(url);
        
        loadingIndicator.classList.add('hidden');
        
        if (!data.items || data.items.length === 0) {
          resultsGrid.innerHTML = '<div class="col-span-full text-center text-muted-foreground py-8">No medications found.</div>';
          return;
        }

        data.items.forEach(drug => {
          const card = document.createElement('div');
          card.className = 'bg-card rounded-2xl border border-border p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col relative group';
          
          card.innerHTML = \`
            <button class="absolute top-4 right-4 text-muted-foreground hover:text-primary transition-colors">
              <iconify-icon icon="lucide:bookmark" class="text-xl"></iconify-icon>
            </button>
            <div class="flex items-center gap-3 mb-4">
              <div class="w-12 h-12 rounded-xl bg-blue-50 text-primary flex items-center justify-center">
                <iconify-icon icon="lucide:pill" class="text-2xl"></iconify-icon>
              </div>
              <div class="min-w-0">
                <h3 class="font-heading font-semibold text-lg text-foreground group-hover:text-primary transition-colors truncate">
                  \${drug.name}
                </h3>
                <p class="text-xs text-muted-foreground truncate">\${drug.generic_name || 'Medicine'}</p>
              </div>
            </div>
            <p class="text-sm text-muted-foreground line-clamp-2 mb-4 flex-1">
              \${drug.purpose || drug.indications || 'Information not available.'}
            </p>
            <button onclick="window.location.href='/MedicineDetails.html?id=\${encodeURIComponent(drug.name)}'"
              class="w-full py-2.5 border border-border rounded-xl text-sm font-medium text-foreground hover:bg-secondary hover:text-primary transition-colors">
              View Details
            </button>
          \`;
          
          resultsGrid.appendChild(card);
        });
      } catch (err) {
        loadingIndicator.classList.add('hidden');
        errorMsg.textContent = err.message || "Failed to load medications.";
        errorMsg.classList.remove('hidden');
      }
    }

    searchBtn.addEventListener('click', () => {
      searchDrugs(searchInput.value.trim());
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchDrugs(searchInput.value.trim());
      }
    });

    // Initial load
    searchDrugs();
  </script>
</body>
</html>
