<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&family=Fira+Code:wght@300..700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <style type="text/tailwindcss">
      @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root { --foreground: #0f172a;
        --secondary: #eff6ff;
        --input: #e2e8f0;
        --font-sans: Inter, sans-serif;
        --accent: #e0f2fe;
        --secondary-foreground: #1e3a8a;
        --card-foreground: #0f172a;
        --border: #e2e8f0;
        --muted-foreground: #64748b;
        --primary: #2563EB;
        --background: #F8FAFC;
        --tertiary: #38bdf8;
        --destructive: #EF4444;
        --radius: 1rem;
        --ring: #2563eb;
        --primary-foreground: #ffffff;
        --card: #FFFFFF;
        --font-heading: 'Inter', sans-serif;
        --muted: #f1f5f9; }
    </style>
  </head>
  <body>
<div class="min-h-screen w-full bg-background flex flex-col items-center justify-center relative font-sans p-6">
  
  <!-- Centered Card -->
  <div class="w-full max-w-[800px] h-[550px] bg-card rounded-2xl shadow-sm border border-border flex overflow-hidden">
    
    <!-- Left Sidebar (30%) -->
    <aside class="w-[240px] border-r border-border p-6 flex flex-col gap-6 bg-card flex-shrink-0">
      
      <!-- Top: Back & Title -->
      <div class="flex items-center gap-3 text-foreground">
        <button class="p-1 hover:bg-muted rounded-full transition-colors text-muted-foreground hover:text-foreground">
          <iconify-icon icon="lucide:arrow-left" class="text-xl"></iconify-icon>
        </button>
        <h1 class="text-xl font-semibold">Settings</h1>
      </div>

      <!-- Menu -->
      <nav class="flex flex-col gap-2">
        <a href="#" class="flex items-center px-4 py-3 bg-background rounded-full shadow-sm border border-border/50 text-primary font-medium text-sm transition-all">
          General
        </a>
        <a href="#" class="flex items-center px-4 py-3 text-muted-foreground hover:text-foreground hover:bg-muted/50 rounded-full font-medium text-sm transition-all">
          Account
        </a>
      </nav>

    </aside>

    <!-- Right Content Area (70%) -->
    <main class="flex-1 p-8 flex flex-col">
      
      <!-- Page Title -->
      <h2 class="text-2xl font-bold text-foreground mb-8">General</h2>

      <!-- Setting Row -->
      <div class="flex items-center justify-between py-4">
        <label class="text-sm font-medium text-foreground">Theme</label>
        
        <!-- Theme Selector -->
        <div class="flex items-center bg-muted p-1 rounded-xl">
          <button class="px-4 py-1.5 text-sm font-medium text-muted-foreground hover:text-foreground rounded-lg transition-colors">
            System
          </button>
          <button class="px-4 py-1.5 text-sm font-medium bg-card text-foreground shadow-sm rounded-lg transition-colors">
            Light
          </button>
          <button class="px-4 py-1.5 text-sm font-medium text-muted-foreground hover:text-foreground rounded-lg transition-colors">
            Dark
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="h-px w-full bg-border my-2"></div>

      <!-- Empty remaining area -->
      <div class="flex-1"></div>

    </main>

  </div>

</div>
</body></html>
