<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Poppins:wght@100..900&family=Fira+Code:wght@300..700&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style type="text/tailwindcss">
    @import "tailwindcss";
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-tertiary: var(--tertiary);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --font-family-sans: var(--font-sans);
        --font-family-heading: var(--font-heading);
      }
      :root { --card-foreground: #0F172A;
        --tertiary: #38bdf8;
        --background: #F8FAFC;
        --ring: #2563EB;
        --border: #E2E8F0;
        --radius: 0.75rem;
        --font-heading: Inter, sans-serif;
        --secondary-foreground: #0F172A;
        --accent: #F1F5F9;
        --destructive: #EF4444;
        --muted: #F1F5F9;
        --secondary: #F1F5F9;
        --primary: #2563EB;
        --card: #FFFFFF;
        --primary-foreground: #FFFFFF;
        --input: #E2E8F0;
        --font-sans: Inter, sans-serif;
        --foreground: #0F172A;
        --muted-foreground: #64748b; }
    </style>
</head>

<body>
  <div class="min-h-screen w-full bg-background flex flex-col relative">
    <!-- Top Nav (Mobile) -->
    <header class="lg:hidden flex items-center justify-between p-4 bg-card border-b border-border">
      <div class="flex items-center">
        <iconify-icon icon="lucide:activity" class="text-primary text-2xl mr-2"></iconify-icon>
        <span class="font-heading font-bold text-foreground">MediChat AI</span>
      </div>
      <button class="text-foreground p-2"><iconify-icon icon="lucide:menu" class="text-2xl"></iconify-icon></button>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- Sidebar -->
      <aside class="w-64 bg-card border-r border-border flex flex-col hidden md:flex h-screen sticky top-0">
        <div class="h-16 flex items-center px-6 border-b border-border">
          <div class="flex items-center gap-2 text-primary font-heading font-bold text-xl">
            <iconify-icon icon="lucide:activity"></iconify-icon>
            <span>MediAI</span>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto py-6 px-4 flex flex-col gap-1">
          <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mb-2 px-2">Main Menu</p>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:layout-dashboard" class="text-lg"></iconify-icon>
            Dashboard
          </a>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:message-circle" class="text-lg"></iconify-icon>
            AI Consult
          </a>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:shield-alert" class="text-lg"></iconify-icon>
            Medicines
          </a>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 bg-primary/10 text-primary rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:microscope" class="text-lg"></iconify-icon>
            Diseases
          </a>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:shield-alert" class="text-lg"></iconify-icon>
            Interactions
          </a>

          <p class="text-xs font-semibold text-muted-foreground uppercase tracking-wider mt-6 mb-2 px-2">Personal</p>
          <a href="#"
            class="flex items-center gap-3 px-3 py-2.5 text-muted-foreground hover:bg-secondary hover:text-foreground rounded-lg font-medium transition-colors">
            <iconify-icon icon="lucide:bookmark" class="text-lg"></iconify-icon>
            Saved Items
          </a>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-y-auto p-4 lg:p-8">
        <div class="max-w-6xl mx-auto">

          <!-- Header & Search -->
          <div class="mb-8">
            <h1 class="text-3xl font-heading font-bold text-foreground mb-2">Disease Lookup</h1>
            <p class="text-muted-foreground mb-8">Search for medical conditions, symptoms, and treatment guidelines.</p>

            <div
              class="bg-card p-4 rounded-2xl shadow-sm border border-border flex flex-col md:flex-row gap-4 items-center">
              <div class="relative flex-1 w-full">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-muted-foreground">
                  <iconify-icon icon="lucide:search" class="text-xl"></iconify-icon>
                </div>
                <input type="text" id="searchInput"
                  class="w-full pl-12 pr-24 py-3.5 bg-background border border-input rounded-full text-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow text-base"
                  placeholder="Search by disease name or symptoms...">
                <button id="searchBtn"
                  class="absolute right-2 top-1/2 -translate-y-1/2 bg-primary text-primary-foreground px-4 py-1.5 rounded-full text-sm font-medium hover:bg-primary/90 transition-colors">
                  Search
                </button>
              </div>

              <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 hide-scrollbar">
                <button
                  class="flex-shrink-0 px-4 py-3 bg-secondary text-secondary-foreground rounded-full text-sm font-medium hover:bg-secondary/80 transition-colors flex items-center">
                  <iconify-icon icon="lucide:filter" class="mr-2"></iconify-icon>
                  Filters
                </button>
                <button
                  class="flex-shrink-0 px-4 py-3 bg-secondary text-secondary-foreground rounded-full text-sm font-medium hover:bg-secondary/80 transition-colors flex items-center">
                  <iconify-icon icon="lucide:activity" class="mr-2"></iconify-icon>
                  By Symptom
                </button>
              </div>
            </div>
          </div>

          <div id="loadingIndicator" class="hidden text-center py-12 text-muted-foreground">
            <iconify-icon icon="lucide:loader-2" class="text-4xl animate-spin mx-auto mb-2"></iconify-icon>
            <p>Searching diseases...</p>
          </div>

          <div id="errorMsg" class="hidden text-center py-4 text-destructive font-medium"></div>

          <!-- Grid -->
          <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated cards -->
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="/api.js"></script>
  <script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultsGrid = document.getElementById('resultsGrid');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorMsg = document.getElementById('errorMsg');

    async function searchDiseases(query = "") {
      resultsGrid.innerHTML = '';
      errorMsg.classList.add('hidden');
      loadingIndicator.classList.remove('hidden');

      try {
        const url = query ? \`/diseases/search?q=\${encodeURIComponent(query)}&limit=12\` : \`/diseases/search?q=A&limit=12\`;
        const data = await window.apiClient.request(url);
        
        loadingIndicator.classList.add('hidden');
        
        if (!data.items || data.items.length === 0) {
          resultsGrid.innerHTML = '<div class="col-span-full text-center text-muted-foreground py-8">No diseases found.</div>';
          return;
        }

        data.items.forEach(disease => {
          const card = document.createElement('div');
          card.className = 'bg-card rounded-2xl p-6 border border-border shadow-sm hover:shadow-md transition-shadow flex flex-col h-full relative group';
          
          card.innerHTML = \`
            <div class="flex justify-between items-start mb-4">
              <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
                <iconify-icon icon="lucide:activity" class="text-xl"></iconify-icon>
              </div>
            </div>
            <h3 class="text-xl font-heading font-semibold text-foreground group-hover:text-primary transition-colors mb-2 truncate">
              \${disease.name}
            </h3>
            <p class="text-sm text-muted-foreground mb-4 line-clamp-3 flex-1">
              \${disease.description || 'No description available.'}
            </p>
            <button onclick="window.location.href='/DiseaseDetails.html?id=\${encodeURIComponent(disease.name)}'"
              class="w-full py-2.5 border border-border rounded-xl text-sm font-medium text-foreground hover:bg-secondary hover:text-primary transition-colors mt-auto">
              View Details
            </button>
          \`;
          
          resultsGrid.appendChild(card);
        });
      } catch (err) {
        loadingIndicator.classList.add('hidden');
        errorMsg.textContent = err.message || "Failed to load diseases.";
        errorMsg.classList.remove('hidden');
      }
    }

    searchBtn.addEventListener('click', () => {
      searchDiseases(searchInput.value.trim());
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        searchDiseases(searchInput.value.trim());
      }
    });

    // Initial load
    searchDiseases();
  </script>
</body>
</html>
